name: Telegram Message Cleaner

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action type'
        required: true
        default: 'single-chat'
        type: choice
        options:
          - single-chat      # Belirli bir sohbet/kanal/grup
          - all-groups       # Tüm gruplardaki kendi mesajlarını sil
      chat:
        description: 'Chat identifier (for single-chat) – @username or numeric ID'
        required: false
      mode:
        description: 'Delete mode: own (only yours) or all (all messages)'
        required: false
        default: 'own'
      limit:
        description: 'Number of messages to fetch (default 1000)'
        required: false
        default: '1000'

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon

      - name: Decode session file from secret
        env:
          SESSION_BASE64: ${{ secrets.TELEGRAM_SESSION_BASE64 }}
        run: |
          if [ -z "$SESSION_BASE64" ]; then
            echo "ERROR: TELEGRAM_SESSION_BASE64 secret is not set."
            exit 1
          fi
          echo "$SESSION_BASE64" | base64 -d > my_session.session
          ls -la my_session.session

      - name: Run tg-cleaner.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ "${{ github.event.inputs.action }}" == "single-chat" ]; then
            CHAT="${{ github.event.inputs.chat }}"
            if [ -z "$CHAT" ]; then
              echo "Error: chat identifier is required for single-chat action."
              exit 1
            fi
            python tg-cleaner.py "$CHAT" "${{ github.event.inputs.mode }}" "${{ github.event.inputs.limit }}"
          elif [ "${{ github.event.inputs.action }}" == "all-groups" ]; then
            python tg-cleaner.py --all-groups --mode "${{ github.event.inputs.mode }}" --limit "${{ github.event.inputs.limit }}"
          else
            echo "Unknown action: ${{ github.event.inputs.action }}"
            exit 1
          fi